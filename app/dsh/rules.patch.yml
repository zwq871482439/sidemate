# 把桌伴的干活规矩写进系统提示：模型看不了图、中文文件要用 edit 工具改，别让模型在辅助脚本上瞎折腾。
# personaPrefix 显式写成空串：不能删这一行，删了会退回 dsh 自带的那句英文人设（模型自称编码助手）。
- id: system-prompt
  config:
    personaPrefix: ''
    personaSuffix: |
      桌伴的干活规矩：
      1. 当前模型看不了图片。不要为了检查效果去渲染预览图、读图，也不要转 PDF 去量文字位置；用 python-docx 之类把内容和结构读回来核对，过了就交稿。用户明说要导出图片或 PDF 时照做。
      2. 交稿后桌伴会统一整理字体和样式。只管自己写进去的字体，不要拆包去查 fontTable、theme、styles 这些 XML。
      3. 改已有的脚本或文本文件用 edit 工具。不要用 PowerShell 的 Get-Content、Set-Content 读写含中文的文件，会把中文读坏。
      4. 成品写在工作区根目录；中间文件和调试输出写进 .草稿/ 目录；都不要写进「桌伴输出」，桌伴整轮干完自己拷过去。

# Sidemate CI — Python 测试 + 前端 JS 语法检查
# 每次 push / PR 自动运行。
#
# 设计说明：
# - 依赖装"精简集"（过滤掉 torch/faiss/transformers 等 KB 重依赖，约省 2GB）。
#   被测代码中这些重依赖全部是函数内懒加载，不影响导入与测试。
# - deselect 的 1 个测试是"嵌入式发行环境完整性断言"（要求 torch/faiss 全在场），
#   属于发行环境检查而非代码逻辑，由 installer_smoke_check（C:\testenv）另行保障。
# - 根目录 tests/ 未入库（私有仓维护），Node 回归在本地 testenv 流程运行。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps（精简集，剔除 KB 重依赖）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          (Get-Content requirements.txt | Where-Object { $_ -notmatch '^(torch|transformers|sentence-transformers|tokenizers|faiss|onnx|FlagEmbedding|accelerate|safetensors)' }) | Out-File -Encoding ascii requirements-ci.txt
          pip install -r requirements-ci.txt pytest

      - name: Python tests（server/tests）
        shell: pwsh
        run: |
          python -m pytest server/tests/ -q `
            --deselect server/tests/test_deps_check.py::TestCheckAll::test_required_deps_not_missing_in_test_env

      - name: Frontend JS syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem server/static/js/*.js, server/static/js/core/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "JS syntax OK"

      # 0.10.1 M1-A 起：esbuild 构建链（仅 v2 新版 UI 源码；legacy 全局脚本不进链）
      - name: v2 build（esbuild）
        shell: pwsh
        run: |
          npm ci
          # 漂移检查基线：关掉 eol 转换、以仓库字节原样检出 dist，
          # 消除 Windows autocrlf 的换行噪音（只留真实内容差异）
          git config core.autocrlf false
          git checkout -- server/static/js/v2/dist
          npm run build
          if (-not (Test-Path server/static/js/v2/dist/bundle.js)) { Write-Error "v2 bundle 产物缺失"; exit 1 }
          Write-Host "v2 build OK"

      # sidemate-dev#22：bundle 与源码一致性卡点——改了源码忘构建/忘更新指纹，这里红。
      # 用 git diff --exit-code（字节级对比），不要用 git status（它会漏掉 eol 形态差异）。
      - name: bundle 漂移检查（git diff --exit-code）
        shell: pwsh
        run: |
          git diff --exit-code server/static/js/v2/dist server/index.html
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::bundle 与源码漂移（或指纹未更新）：请本地 npm run build 后把 dist 产物与 server/index.html 一起提交"
            exit 1
          }
          Write-Host "bundle 与源码一致"

      # sidemate-dev#21：no-undef 机器卡点（node --check 只查语法，拦不住作用域错误——
      # 934a1c7 的 _kind2 就是这么漏进 main 的）。只查 v2 源码，不查 dist 产物。
      - name: v2 lint（no-undef）
        shell: pwsh
        run: |
          npm run lint

      # 0.10.1 M1-C 起：模式分支白名单（新文件引入 ai_mode 分支即挂红）
      - name: 模式分支白名单检查
        shell: pwsh
        run: |
          python tools/check_mode_branches.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

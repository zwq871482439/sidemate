<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0.9.6 卡片式明盒原型 v2 — 桌伴</title>
<style>
:root {
  --c-bg:#fff; --c-bg-2:#f3f2ed; --c-bg-3:#e8e7e2; --c-bg-info:#E6F1FB;
  --c-text:#1f2937; --c-text-2:#4b5563; --c-text-3:#9ca3af; --c-text-info:#185FA5;
  --c-border:rgba(0,0,0,.15); --c-border-2:rgba(0,0,0,.3); --c-info-border:#B5D4F4;
  --r-md:8px; --r-lg:12px; --font:system-ui,-apple-system,sans-serif;
  --dot-ok:#1D9E75; --dot-run:#7F77DD; --dot-wait:#D3D1C7; --dot-err:#E24B4A;
  --accent-user:#185FA5; --accent-ai:#7F77DD;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);font-size:13px;color:var(--c-text);background:#f7f7f4;padding:20px}
.proto-label{font-size:12px;color:var(--c-text-3);margin-bottom:8px}
.proto-hint{font-size:11px;color:var(--c-text-3);margin-bottom:16px;line-height:1.7;background:var(--c-bg-2);padding:10px 14px;border-radius:var(--r-md);border-left:3px solid var(--dot-run)}
.proto-hint b{color:var(--c-text-2)}
.proto-hint .tag{display:inline-block;background:var(--c-bg-info);color:var(--c-text-info);padding:1px 6px;border-radius:3px;font-size:10px;margin:0 2px}

.app{display:flex;flex-direction:column;height:720px;border-radius:var(--r-lg);border:0.5px solid var(--c-border);overflow:hidden;background:var(--c-bg);position:relative}
.hdr{display:flex;align-items:center;padding:7px 14px;gap:10px;border-bottom:0.5px solid var(--c-border);background:var(--c-bg-2);flex-shrink:0}
.hdr .logo{font-weight:500;font-size:14px;color:#1E3A5F}
.scene-bar{display:flex;gap:6px;margin-left:14px}
.scene-bar button{padding:4px 12px;font-size:11px;border:0.5px solid var(--c-border-2);border-radius:6px;cursor:pointer;background:var(--c-bg);color:var(--c-text-2);transition:all .15s}
.scene-bar button:hover{background:var(--c-bg-info);color:var(--c-text-info)}
.scene-bar button.sel{background:#1E3A5F;color:#fff;border-color:#1E3A5F}
.opt-bar{display:flex;gap:10px;margin-left:auto;align-items:center;font-size:11px}
.opt-bar select{font-size:11px;padding:2px 6px;border:0.5px solid var(--c-border-2);border-radius:4px;background:var(--c-bg)}

.messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;background:#FAFAF8}

.ic{display:inline-flex;vertical-align:-2px}
.ic svg{display:block}

.card{position:relative;border:0.5px solid var(--c-border);border-radius:var(--r-md);background:var(--c-bg);overflow:hidden;transition:border-color .3s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.user::before{background:var(--accent-user)}
.card.ai::before{background:var(--accent-ai)}
.card.ai{padding-left:3px}

.card-hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid transparent;transition:all .3s}
.card.user .card-hdr{padding:6px 14px 4px}
.card-hdr .who{font-size:12px;font-weight:500;color:var(--c-text-2);display:flex;align-items:center;gap:5px}
.card-hdr .who .ic{color:var(--accent-ai)}
.card.user .card-hdr .who .ic{color:var(--accent-user)}
.card-hdr .meta{font-size:11px;color:var(--c-text-3)}
.card-hdr .spacer{flex:1}
.card-hdr .copy-btn{font-size:11px;color:var(--c-text-3);cursor:pointer;padding:3px 8px;border:0.5px solid var(--c-border);border-radius:4px;background:transparent;display:flex;align-items:center;gap:3px}
.card-hdr .copy-btn:hover{color:var(--c-text-info);border-color:var(--c-info-border)}

.card.working .card-hdr{border-bottom-color:var(--c-border);background:linear-gradient(90deg,rgba(127,119,221,.04),transparent)}
.card.working .card-hdr .who{color:var(--dot-run)}
.card.done .card-hdr{border-bottom-color:transparent;background:transparent}
.working-dots{display:inline-flex;gap:3px;margin-left:2px}
.working-dots .d{width:4px;height:4px;border-radius:50%;background:var(--dot-run);animation:wdot 1.4s infinite}
.working-dots .d:nth-child(2){animation-delay:.2s}
.working-dots .d:nth-child(3){animation-delay:.4s}
@keyframes wdot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.card-process{padding:8px 14px}
.cb-step{position:relative;padding:3px 0 3px 17px;font-size:12px;animation:cbIn .3s ease-out}
.cb-step-row{display:flex;align-items:center;gap:6px;min-width:0}
.cb-dot{position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%}
.cb-dot.ok{background:var(--dot-ok)}
.cb-dot.run{background:var(--dot-run);animation:dpulse 1.2s infinite}
.cb-dot.wait{background:var(--dot-wait)}
.cb-dot.err{background:var(--dot-err)}
@keyframes dpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
@keyframes cbIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.cb-label{color:var(--c-text-2);font-weight:500}
.cb-step[data-status="done"] .cb-label{color:var(--c-text)}
.cb-step[data-status="running"] .cb-label{color:var(--dot-run)}
.cb-time{color:var(--c-text-3);font-size:11px;margin-left:auto;padding-left:8px}
.cb-count{color:var(--c-text-3);font-size:11px}

.cb-output{margin:4px 0 4px 0;padding-left:10px;border-left:2px solid var(--c-bg-3);overflow:hidden}
.cb-transform{display:flex;flex-direction:column;gap:3px}
.cb-tf-row{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cb-tf-key{color:var(--c-text-3);font-size:10px;min-width:42px;flex-shrink:0}
.cb-tf-val{color:var(--c-text-2);font-size:11px;flex:1;min-width:0;word-break:break-word}
.cb-tf-val.hl{color:var(--dot-run);font-weight:500}
.cb-sources{display:flex;flex-direction:column;gap:5px}
.cb-src{padding:5px 8px;background:var(--c-bg-2);border-radius:4px}
.cb-src-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cb-src-num{width:15px;height:15px;border-radius:3px;background:var(--c-bg-3);color:var(--c-text-2);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb-src-label{color:var(--c-text);font-weight:500;font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-src-tok{color:var(--c-text-3);font-size:10px;flex-shrink:0;margin-left:4px}
.cb-src-snippet{margin-top:3px;color:var(--c-text-3);font-size:10px;line-height:1.5;word-break:break-word}
.cb-thinking{padding:5px 8px;background:rgba(127,119,221,.06);border-radius:4px;color:var(--c-text-3);font-size:11px;line-height:1.6;border-left:2px solid #AFA9EC;word-break:break-word}

.cb-par{display:flex;gap:10px;margin:4px 0}
.cb-par-col{flex:1;min-width:0;padding:8px 10px;background:var(--c-bg-2);border-radius:5px}
.cb-par-col-title{font-size:10px;color:var(--c-text-3);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.cb-par-col-title .ic{color:var(--c-text-2)}
.cb-par-col .cb-step{padding:2px 0;font-size:11px}
.cb-par-stream{margin-top:6px;font-size:11px;line-height:1.6;color:var(--c-text-2);min-height:14px;white-space:pre-wrap;word-break:break-all}
.cb-par-stream.streaming::after{content:'▎';color:var(--dot-run);animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

.cb-par-summary{display:flex;gap:8px;margin:4px 0}
.cb-par-sum-item{flex:1;min-width:0;padding:6px 10px;background:var(--c-bg-2);border-radius:5px;cursor:pointer;border-left:2px solid var(--c-bg-3);transition:all .15s}
.cb-par-sum-item:hover{background:var(--c-bg-3)}
.cb-par-sum-item.local{border-left-color:var(--dot-ok)}
.cb-par-sum-item.cloud{border-left-color:var(--c-text-info)}
.cb-par-sum-head{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--c-text-3);font-weight:500;margin-bottom:2px}
.cb-par-sum-head .ic{color:var(--c-text-2)}
.cb-par-sum-preview{font-size:11px;color:var(--c-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card-body{padding:10px 14px;color:var(--c-text);line-height:1.7;min-height:20px}
.card-body.streaming::after{content:'▎';color:var(--dot-run);animation:blink 1s infinite;margin-left:1px}
.card-body strong{color:var(--c-text)}
.card-body code{background:var(--c-bg-3);padding:1px 4px;border-radius:3px;font-size:12px}

.card-footer{display:flex;gap:4px;padding:6px 14px;border-top:0.5px dashed var(--c-border);align-items:center}
.act-btn{font-size:11px;color:var(--c-text-3);cursor:pointer;padding:3px 8px;border:none;border-radius:4px;background:transparent;display:flex;align-items:center;gap:3px;transition:all .15s}
.act-btn:hover{background:var(--c-bg-2);color:var(--c-text-info)}
.card-footer .stat{font-size:11px;color:var(--c-text-3);margin-left:auto;padding:0 4px}
.card-footer .stat b{color:var(--c-text-2);font-weight:500}

.detail-box{margin:0 14px 10px}
.detail-box summary{cursor:pointer;font-size:11px;color:var(--c-text-3);padding:4px 0;list-style:none;display:flex;align-items:center;gap:4px}
.detail-box summary::-webkit-details-marker{display:none}
.detail-box summary::before{content:'▸';font-size:9px}
.detail-box[open] summary::before{content:'▾'}
.detail-body{padding:8px 12px;background:var(--c-bg-2);border-radius:4px;font-size:11px}
.detail-kv{display:flex;gap:8px;padding:2px 0}
.detail-kv .k{color:var(--c-text-3);min-width:64px}
.detail-kv .v{color:var(--c-text)}

.cb-reason{border:0.5px solid var(--c-border);border-radius:5px;margin:4px 0;overflow:hidden}
.cb-reason summary{padding:6px 10px;cursor:pointer;font-size:11px;color:var(--c-text-2);display:flex;align-items:center;gap:6px;background:var(--c-bg-2);list-style:none}
.cb-reason summary::-webkit-details-marker{display:none}
.cb-reason summary::before{content:'▶';font-size:8px;color:var(--c-text-3);transition:transform .15s}
.cb-reason[open] summary::before{transform:rotate(90deg)}
.cb-reason.current summary{background:rgba(127,119,221,.06)}
.cb-reason.current summary .cb-reason-round{color:var(--dot-run)}
.cb-reason .cb-step{padding:3px 10px}
.cb-reason-round{color:var(--c-text-info);font-weight:500}
.cb-reason-time{margin-left:auto;color:var(--c-text-3);font-size:10px}

.phase-label{font-size:10px;color:var(--c-text-3);font-weight:500;margin:8px 0 4px;letter-spacing:.5px;padding-left:14px}
.card.user .u-text{padding:0 14px 8px;color:var(--c-text);line-height:1.6}

.controls{padding:10px 16px;border-top:0.5px solid var(--c-border);background:var(--c-bg-2);display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{padding:6px 14px;border:0.5px solid var(--c-border-2);border-radius:6px;cursor:pointer;font-size:12px;background:var(--c-bg);color:var(--c-text-2);transition:all .15s}
.btn:hover{background:var(--c-bg-info);color:var(--c-text-info)}
.btn-primary{background:#1E3A5F;color:#fff;border-color:#1E3A5F}
.btn-primary:hover{opacity:.9;background:#1E3A5F;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty-state{color:var(--c-text-3);font-size:12px;text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="proto-label">0.9.6 卡片式明盒原型 v2 — 桌伴 Sidemate</div>
<div class="proto-hint">
<b>v2 改进</b>：统一分栏对齐 · 并行阶段1双列实时打字+阶段2自动折叠为摘要条(方案Z) · 终态不淡化 · 用户卡片加header呼应 · footer操作按钮(复制/重试/追问) · 推理单元默认折叠只当前轮展开<br>
<b>4场景</b>：<span class="tag">离线聊天</span><span class="tag">离线KB</span><span class="tag">在线Agent</span><span class="tag">并行</span>
</div>

<div class="app">
  <div class="hdr">
    <span class="logo">桌伴 · Sidemate</span>
    <div class="scene-bar">
      <button class="sel" onclick="pickScene(this,'local_chat')">离线-聊天</button>
      <button onclick="pickScene(this,'local_kb')">离线-知识库</button>
      <button onclick="pickScene(this,'cloud')">在线-Agent</button>
      <button onclick="pickScene(this,'parallel')">并行</button>
    </div>
    <div class="opt-bar"><label>速度 <select id="speedSel"><option value="600">正常</option><option value="300">快</option><option value="1200">慢</option></select></label></div>
  </div>
  <div class="messages" id="messages"><div class="empty-state">选择场景并点击"播放演示"</div></div>
  <div class="controls">
    <button class="btn btn-primary" id="playBtn" onclick="playScene()">▶ 播放演示</button>
    <button class="btn" onclick="resetScene()">↺ 重置</button>
  </div>
</div>

<script>
var ICONS={
  check:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M4 7l2.5 2.5L10 5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9 9l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  book:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 1.5h5l3 4v7a1 1 0 01-1 1H2a.5.5 0 01-.5-.5V2a.5.5 0 01.5-.5z" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5v4h4" stroke="currentColor" stroke-width="1.2"/></svg>',
  write:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 10.5V12.5h2l7-7-2-2-7 7z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cloud:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M4 10a3 3 0 010-6 4 4 0 017.5 1A2.5 2.5 0 0111 10H4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  brain:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 2a2 2 0 00-2 2v6a2 2 0 002 2 2 2 0 002-2V4a2 2 0 00-2-2z" stroke="currentColor" stroke-width="1.2"/><path d="M5 5H3.5A1.5 1.5 0 002 6.5 1.5 1.5 0 003.5 8H5M9 5h1.5A1.5 1.5 0 0112 6.5 1.5 1.5 0 0110.5 8H9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>',
  copy:'<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><rect x="3" y="3" width="7" height="9" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M5 3V2a1 1 0 011-1h5a1 1 0 011 1v8a1 1 0 01-1 1h-1" stroke="currentColor" stroke-width="1.1"/></svg>',
  refresh:'<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M11.5 4.5A5 5 0 102 7.5M2 2v3.5h3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chat:'<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M1.5 2.5h11a1 1 0 011 1v6a1 1 0 01-1 1H5l-3 2.5V11h-.5a1 1 0 01-1-1v-6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  gear:'<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.2"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
};
function ic(n){return '<span class="ic">'+ICONS[n]+'</span>'}

var currentScene='local_chat',playing=false;
function sp(){return parseInt(document.getElementById('speedSel').value)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function pickScene(b,s){currentScene=s;document.querySelectorAll('.scene-bar button').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');resetScene()}
function resetScene(){playing=false;document.getElementById('playBtn').disabled=false;document.getElementById('messages').innerHTML='<div class="empty-state">选择场景并点击"播放演示"</div>'}

function dot(s){return '<span class="cb-dot '+s+'"></span>'}
function stepHtml(id,label,status,time,count,out){var t=time?'<span class="cb-time">'+time+'</span>':'';var c=count!=null?'<span class="cb-count">('+count+'篇)</span>':'';return '<div class="cb-step" data-status="'+status+'" data-id="'+id+'">'+dot(status)+'<div class="cb-step-row"><span class="cb-label">'+label+'</span>'+c+t+'</div>'+(out||'')+'</div>'}
function tfOut(o,r,c){return '<div class="cb-output"><div class="cb-transform"><div class="cb-tf-row"><span class="cb-tf-key">原问题</span><span class="cb-tf-val">'+o+'</span></div><div class="cb-tf-row"><span class="cb-tf-key">改写为</span><span class="cb-tf-val '+(c?'hl':'')+'">'+r+'</span></div></div></div>'}
function srcOut(ss){var i=ss.map(function(s,idx){return '<div class="cb-src"><div class="cb-src-head"><span class="cb-src-num">'+(idx+1)+'</span><span class="cb-src-label">'+s.label+'</span><span class="cb-src-tok">'+s.tok+' 词元</span></div><div class="cb-src-snippet">'+s.snip+'</div></div>'}).join('');return '<div class="cb-output"><div class="cb-sources">'+i+'</div></div>'}
function thOut(t){return '<div class="cb-output"><div class="cb-thinking">'+t+'</div></div>'}

function userCard(text){return '<div class="card user"><div class="card-hdr"><span class="who">'+ic('chat')+'你</span><span class="meta">刚刚</span></div><div class="u-text">'+text+'</div></div>'}
function aiCard(modeLabel){return '<div class="card ai working" id="aiCard"><div class="card-hdr"><span class="who" id="whoLabel">'+ic('brain')+'桌伴 正在'+modeLabel+'<span class="working-dots"><span class="d"></span><span class="d"></span><span class="d"></span></span></span><span class="spacer"></span></div><div class="card-process" id="cardProcess"></div><div class="card-body" id="cardBody"></div></div>'}

async function streamText(text,delay){delay=delay||28;var el=document.getElementById('cardBody');el.classList.add('streaming');for(var i=1;i<=text.length;i+=2){el.innerHTML=text.slice(0,i).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');document.getElementById('messages').scrollTop=99999;await sleep(delay)}el.innerHTML=text.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');el.classList.remove('streaming')}

function setCardState(s){var c=document.getElementById('aiCard');c.classList.remove('working','answering','done');c.classList.add(s)}
function updateHdr(state,modeLabel,elapsed){var h=document.getElementById('whoLabel');if(state==='answering'){h.innerHTML=ic('write')+'桌伴 正在回答<span class="working-dots"><span class="d"></span><span class="d"></span><span class="d"></span></span>';setCardState('answering')}else if(state==='done'){h.innerHTML=ic('brain')+'桌伴 · '+modeLabel+' · '+elapsed;var hw=document.querySelector('#aiCard .card-hdr');if(!hw.querySelector('.copy-btn'))hw.innerHTML+='<span class="spacer"></span><button class="copy-btn">'+ic('copy')+'复制</button>';setCardState('done')}}

function addFooter(model,chars,time,hasDetail){var c=document.getElementById('aiCard');var f='<div class="card-footer"><button class="act-btn">'+ic('copy')+'复制</button><button class="act-btn">'+ic('refresh')+'重试</button><button class="act-btn">'+ic('chat')+'追问</button><span class="stat"><b>'+model+'</b> · '+chars+'字 · '+time+'s</span></div>';c.insertAdjacentHTML('beforeend',f);if(hasDetail){c.insertAdjacentHTML('beforeend','<details class="detail-box"><summary>'+ic('gear')+'执行详情</summary><div class="detail-body"><div class="detail-kv"><span class="k">输入词元</span><span class="v">1,247</span></div><div class="detail-kv"><span class="k">输出词元</span><span class="v">142</span></div><div class="detail-kv"><span class="k">推理词元</span><span class="v">386</span></div></div></details>')}}

async function streamParText(sel,text,delay){delay=delay||40;var el=document.querySelector(sel);el.classList.add('streaming');for(var i=1;i<=text.length;i+=2){el.textContent=text.slice(0,i);document.getElementById('messages').scrollTop=99999;await sleep(delay)}el.textContent=text;el.classList.remove('streaming')}

async function sceneLocalChat(){
  var m=document.getElementById('messages');
  m.innerHTML=userCard('你好，介绍一下自己')+aiCard('思考');
  await sleep(sp());updateHdr('answering');await sleep(300);

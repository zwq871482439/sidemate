<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P6 设置页原型 — 桌伴</title>
<style>
:root {
  --color-background-primary: #fff;
  --color-background-secondary: #f3f2ed;
  --color-background-tertiary: #e8e7e2;
  --color-background-info: #E6F1FB;
  --color-text-primary: #1f2937;
  --color-text-secondary: #4b5563;
  --color-text-tertiary: #9ca3af;
  --color-text-info: #185FA5;
  --color-border-primary: rgba(0,0,0,.4);
  --color-border-secondary: rgba(0,0,0,.3);
  --color-border-tertiary: rgba(0,0,0,.15);
  --color-border-info: #B5D4F4;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: system-ui, -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-sans); font-size:13px; color: var(--color-text-primary); background: #f7f7f4; padding: 20px; }
.proto-label { font-size:12px; color: var(--color-text-tertiary); margin-bottom:10px; }
.app { display:flex; flex-direction:column; height:460px; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow:hidden; background: var(--color-background-primary); }

.hdr { display:flex; align-items:center; padding:7px 14px; gap:10px; border-bottom:0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); flex-shrink:0; }
.hdr .logo { font-weight:500; font-size:14px; color:#1E3A5F; }

.tabs { display:flex; gap:0; border-bottom:2px solid var(--color-border-tertiary); flex-shrink:0; }
.tabs button { padding:7px 18px; border:none; background:none; cursor:pointer; font-size:13px; color:var(--color-text-secondary); border-bottom:2px solid transparent; margin-bottom:-2px; }
.tabs button:hover { color:var(--color-text-primary); }
.tabs button.on { color:#1E3A5F; border-bottom-color:#1E3A5F; font-weight:500; }

.body { display:flex; flex:1; min-height:0; overflow:hidden; }
.nav { width:155px; flex-shrink:0; border-right:0.5px solid var(--color-border-tertiary); background:var(--color-background-secondary); padding:10px 8px; display:flex; flex-direction:column; gap:2px; }
.nav-item { padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:var(--color-text-secondary); display:flex; align-items:center; gap:8px; }
.nav-item:hover { background:var(--color-background-primary); }
.nav-item.sel { background:var(--color-background-info); color:#1E3A5F; font-weight:500; }
.nav-item .ni { opacity:.5; flex-shrink:0; }
.nav-item.sel .ni { opacity:1; }

.content { flex:1; overflow-y:auto; padding:16px; }
.card { background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:14px; margin-bottom:10px; }
.card h4 { font-size:12px; font-weight:500; margin-bottom:8px; color:var(--color-text-primary); }
.row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:12px; }
.row .lbl { color:var(--color-text-secondary); }
.row .val { font-weight:500; }
.row .val.warn { color:#BA7517; }
.row .val.ok { color:#1D9E75; }
.progress { height:6px; border-radius:3px; background:var(--color-border-tertiary); margin-top:4px; }
.progress-bar { height:6px; border-radius:3px; background:#1E3A5F; }
</style>
</head>
<body>
<div class="proto-label">P6 设置页原型 — 桌伴 Sidemate v0.9.6（方案A：左侧竖排Tab）</div>

<div class="app">
  <div class="hdr"><span class="logo">桌伴 · Sidemate</span><span style="font-size:11px;color:var(--color-text-tertiary);">v0.9.6</span></div>
  <div class="tabs"><button>对话</button><button>知识库</button><button class="on">设置</button></div>
  <div class="body">
    <div class="nav">
      <div class="nav-item sel">
        <span class="ni"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 3.5v7M3.5 7h7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></span>常规
      </div>
      <div class="nav-item">
        <span class="ni"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4.5 1L2 5.5V12a1 1 0 001 1h8a1 1 0 001-1V5.5L9.5 1H4.5z" stroke="currentColor" stroke-width="1.2"/></svg></span>云端 AI
      </div>
      <div class="nav-item">
        <span class="ni"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="5" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="7.5" y="2" width="5" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/></svg></span>知识库
      </div>
      <div class="nav-item">
        <span class="ni"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="6" width="8" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M5 6V4a2 2 0 014 0v2" stroke="currentColor" stroke-width="1.2"/></svg></span>隐私安全
      </div>
      <div class="nav-item">
        <span class="ni"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 7l2.5 2.5L10 5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>关于
      </div>
    </div>
    <div class="content" id="settingsContent">
      <div class="card">
        <h4>系统资源占用</h4>
        <div class="row"><span class="lbl">系统内存</span><span class="val">3.2 GB / 15.9 GB</span></div>
        <div class="progress"><div class="progress-bar" style="width:18%"></div></div>
        <div class="row"><span class="lbl">桌伴占用</span><span class="val">2.8 GB</span></div>
        <div class="row"><span class="lbl">可用内存</span><span class="val ok">12.7 GB</span></div>
      </div>
      <div class="card">
        <h4>数据目录</h4>
        <div class="row"><span class="lbl">存储位置</span><span class="val" style="font-size:11px;">AppData/Local/Sidemate</span></div>
        <div class="row"><span class="lbl">磁盘占用</span><span class="val">4.1 GB</span></div>
      </div>
      <div class="card">
        <h4>反馈渠道</h4>
        <div class="row"><span class="lbl">问题反馈</span><span class="val" style="color:#1E3A5F;cursor:pointer;">提交反馈</span></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
